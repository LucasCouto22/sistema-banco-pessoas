<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block titulo %}Qualy Vortice{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#F8F4F5;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F8F4F5;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(220,40,90,.10);">
          <tr>
            <td style="background:#0B0B0D;padding:22px 28px;text-align:center;">
              <span style="font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:700;color:#F2295B;letter-spacing:.01em;">Qualy Vortice</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 28px 8px;">
              {% block conteudo %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px 24px;border-top:1px solid #F1E4E8;margin-top:20px;font-size:12px;line-height:1.6;color:#9A8790;">
              Qualy Vortice — Captação e gestão de participantes de pesquisa.<br>
              Este é um e-mail automático; não responda a esta mensagem.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
