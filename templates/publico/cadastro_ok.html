{% load static_v %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro enviado · Qualy Vortice</title>
<link rel="stylesheet" href="{% static_v 'css/base.css' %}">
</head>
<body>
<section id="viewLogin">
  <div class="login-card" style="text-align:center">
    <div class="brand" style="justify-content:center"><span class="brand-mark"></span><h1>Qualy Vortice</h1></div>
    <h2 style="margin-top:18px;font-size:1.15rem">Cadastro recebido!</h2>
    <p class="login-sub">Obrigado, {{ participante.nome }}. Seu código de participante é:</p>
    <p class="mono" style="font-size:1.1rem;font-weight:700;color:var(--violet-deep);background:var(--violet-soft);border-radius:10px;padding:10px 16px;display:inline-block;margin:8px 0 16px">{{ participante.codigo }}</p>
    <p class="login-sub">A equipe da pesquisa "{{ projeto.nome }}" entrará em contato em breve.</p>
  </div>
</section>
</body>
</html>
